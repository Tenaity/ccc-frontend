server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serve pre-compressed assets when available
    gzip_static on;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
}
